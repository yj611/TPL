<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>信号与系统：波形闯关实验室</title>
<style>
:root{--bg:#07111f;--panel:#0d1b2d;--text:#eaf2ff;--muted:#97acd0;--accent:#55d6be;--accent2:#6ca8ff;--warn:#ffcc66;--bad:#ff6b81;--good:#63e6a7;--line:#2c4568}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 15%,rgba(108,168,255,.12),transparent 28%),radial-gradient(circle at 85% 20%,rgba(85,214,190,.10),transparent 30%),linear-gradient(180deg,#06101d,#081729 55%,#06101d);color:var(--text);font-family:Inter,"Microsoft YaHei",system-ui,sans-serif}.app{max-width:1180px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:18px;flex-wrap:wrap}.brand h1{margin:0;font-size:clamp(24px,4vw,40px)}.brand p{margin:7px 0 0;color:var(--muted)}.stats{display:flex;gap:10px;flex-wrap:wrap}.pill{background:rgba(13,27,45,.86);border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-weight:700}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}@media(max-width:900px){.grid{grid-template-columns:1fr}}.card{background:linear-gradient(180deg,rgba(16,36,61,.92),rgba(10,25,43,.94));border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.25)}.topline{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.mode{color:var(--accent);font-weight:800;font-size:14px}.question{font-size:22px;line-height:1.5;margin:10px 0 12px}.formula{background:#071525;border:1px solid #29476d;border-radius:14px;padding:12px 14px;font-family:"Times New Roman",serif;font-size:22px;text-align:center}canvas{width:100%;height:300px;background:#071525;border:1px solid #29476d;border-radius:16px;margin-top:14px;display:block}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}@media(max-width:560px){.choices{grid-template-columns:1fr}}button{appearance:none;border:none;border-radius:13px;padding:13px 14px;background:#132b48;color:var(--text);font-weight:750;font-size:15px;cursor:pointer;border:1px solid #315277;transition:.18s}button:hover{transform:translateY(-2px);background:#19385d}button:disabled{cursor:not-allowed;opacity:.6;transform:none}.primary{background:linear-gradient(135deg,#267d85,#315fbd);border-color:#56b8d7}.choice.correct{background:rgba(99,230,167,.18);border-color:var(--good)}.choice.wrong{background:rgba(255,107,129,.16);border-color:var(--bad)}.feedback{min-height:64px;margin-top:14px;border-radius:14px;padding:12px 14px;background:#091827;border:1px solid #29476d;color:var(--muted);line-height:1.55}.feedback.good{border-color:var(--good);color:#c9ffe1}.feedback.bad{border-color:var(--bad);color:#ffd2db}.side h2{margin:0 0 10px}.level-list{display:grid;gap:10px}.level-item{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:#0a192b;border:1px solid #29476d}.level-dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:900;background:#17314f;color:var(--muted)}.level-item.active{border-color:var(--accent2)}.level-item.active .level-dot{background:var(--accent2);color:#06101d}.level-item.done{border-color:var(--good)}.level-item.done .level-dot{background:var(--good);color:#06101d}.tip{margin-top:14px;padding:14px;border-left:4px solid var(--warn);background:rgba(255,204,102,.08);border-radius:10px;color:#ffe7ae;line-height:1.6}.progress{height:10px;background:#071525;border-radius:999px;overflow:hidden;margin-top:10px}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:.35s}.footer-actions{display:flex;justify-content:flex-end;margin-top:14px}.overlay{position:fixed;inset:0;background:rgba(3,9,16,.82);display:none;place-items:center;padding:20px;z-index:20}.overlay.show{display:grid}.modal{width:min(520px,100%);background:#0d1b2d;border:1px solid #3d5d85;border-radius:24px;padding:26px;text-align:center}.modal h2{font-size:34px;margin:0 0 8px}.small{font-size:13px;color:var(--muted)}
</style></head>
<body><div class="app"><header><div class="brand"><h1>信号与系统：波形闯关实验室</h1><p>通过 10 道随机题，击败“失真信号”，完成时域与系统性质训练。</p></div><div class="stats"><div class="pill">得分：<span id="score">0</span></div><div class="pill">生命：<span id="lives">❤❤❤</span></div><div class="pill">连击：<span id="combo">0</span></div></div></header><div class="grid"><main class="card"><div class="topline"><div class="mode" id="modeLabel">波形变换</div><div class="small">第 <span id="qIndex">1</span>/10 题</div></div><div class="progress"><div class="bar" id="bar"></div></div><div class="question" id="question"></div><div class="formula" id="formula"></div><canvas id="plot" width="760" height="300"></canvas><div class="choices" id="choices"></div><div class="feedback" id="feedback">选择一个答案开始闯关。</div><div class="footer-actions"><button id="nextBtn" class="primary" disabled>下一题</button></div></main><aside class="card side"><h2>关卡地图</h2><div class="level-list" id="levelList"></div><div class="tip" id="tip">提示：先判断“先平移还是先伸缩”，再观察时间反转是否出现。</div></aside></div></div><div class="overlay" id="overlay"><div class="modal"><h2 id="resultTitle">闯关完成</h2><p id="resultText"></p><button class="primary" onclick="restartGame()">再来一局</button></div></div>
<script>
const canvas=document.getElementById('plot'),ctx=canvas.getContext('2d');const modes=[{name:'波形变换',tip:'先看括号内变量：x(at-b) 中，a 决定伸缩和反转，b/a 决定平移。'},{name:'系统性质',tip:'线性看叠加；时不变看输入平移后，输出是否等量平移。'},{name:'卷积直觉',tip:'卷积的核心是翻转、平移、相乘、积分；矩形信号卷积常得到三角形。'},{name:'频域判断',tip:'时域平移对应频域相位变化，时域卷积对应频域乘积。'}];let state={score:0,lives:3,combo:0,index:0,answered:false,correctCount:0},questions=[];
function buildQuestions(){const bank=[{mode:0,q:'已知图中为 x(t)，下列哪一项表示“先压缩 2 倍，再向右平移 1”？',formula:'请选择正确表达式',choices:['x(2t-2)','x(2t-1)','x(t/2-1)','x(-2t+2)'],answer:0,explain:'x(2t-2)=x[2(t-1)]：相对 x(t) 压缩 2 倍，并向右平移 1。',plot:'base'},{mode:0,q:'x(-t+2) 相对于 x(t) 的正确变换顺序是？',formula:'x(-t+2)=x[-(t-2)]',choices:['先右移2，再反转','先反转，再右移2','先左移2，再反转','只进行时间反转'],answer:1,explain:'可写为 x[-(t-2)]：先对 x(t) 做时间反转得到 x(-t)，再向右平移 2。',plot:'transform'},{mode:0,q:'若 x(t) 的持续时间为 4 秒，则 x(0.5t) 的持续时间为多少？',formula:'y(t)=x(0.5t)',choices:['1 秒','2 秒','4 秒','8 秒'],answer:3,explain:'|a|<1 时为时间扩展，扩展倍数为 1/|a|=2，所以持续时间变为 8 秒。',plot:'stretch'},{mode:1,q:'系统 y(t)=3x(t)+2 是否为线性系统？',formula:'T{x(t)}=3x(t)+2',choices:['线性','非线性','仅时不变','无法判断'],answer:1,explain:'零输入时输出为 2，不满足齐次性，因此是非线性系统。',plot:'system'},{mode:1,q:'系统 y(t)=x(t-2) 是否为时不变系统？',formula:'T{x(t)}=x(t-2)',choices:['是','否','仅当 t>2 时是','取决于输入'],answer:0,explain:'输入延迟 t₀ 后，输出同样延迟 t₀，满足时不变性。',plot:'delay'},{mode:1,q:'系统 y(t)=t·x(t) 的性质是？',formula:'T{x(t)}=t x(t)',choices:['线性且时不变','线性但时变','非线性且时不变','非线性且时变'],answer:1,explain:'它满足叠加性，因此线性；但显式含 t，平移检验不成立，所以时变。',plot:'system'},{mode:2,q:'两个相同单位矩形脉冲卷积后，波形通常是什么形状？',formula:'rect(t) * rect(t)',choices:['矩形','三角形','冲激','正弦'],answer:1,explain:'重叠面积随平移先线性增加、再线性减小，因此得到三角形。',plot:'conv'},{mode:2,q:'任意信号与单位冲激 δ(t-t₀) 卷积的结果是？',formula:'x(t) * δ(t-t₀)',choices:['x(t)','x(t+t₀)','x(t-t₀)','0'],answer:2,explain:'冲激卷积具有移位性质：x(t)*δ(t-t₀)=x(t-t₀)。',plot:'impulse'},{mode:2,q:'若 x(t) 和 h(t) 都是因果信号，则 y(t)=x(t)*h(t) 是否一定因果？',formula:'y(t)=∫x(τ)h(t-τ)dτ',choices:['一定因果','一定非因果','只有稳定时因果','无法判断'],answer:0,explain:'两个因果信号在 t<0 时没有有效重叠，因此卷积结果仍为因果信号。',plot:'causal'},{mode:3,q:'时域卷积 x(t)*h(t) 在频域中对应什么？',formula:'ℱ{x(t)*h(t)} = ?',choices:['X(jω)+H(jω)','X(jω)H(jω)','X(jω)*H(jω)','X(jω)/H(jω)'],answer:1,explain:'卷积定理：时域卷积对应频域乘积。',plot:'freq'},{mode:3,q:'x(t-t₀) 的傅里叶变换是？',formula:'ℱ{x(t-t₀)}',choices:['X(jω-t₀)','e^{-jωt₀}X(jω)','e^{jωt₀}X(jω)','t₀X(jω)'],answer:1,explain:'时移性质：x(t-t₀) ↔ e^{-jωt₀}X(jω)。',plot:'phase'},{mode:3,q:'实偶信号的傅里叶变换通常具有哪种性质？',formula:'x(t) 为实偶信号',choices:['纯虚奇函数','实偶函数','复奇函数','常数'],answer:1,explain:'实偶信号的傅里叶变换为实偶函数。',plot:'freq'}];for(let i=bank.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bank[i],bank[j]]=[bank[j],bank[i]]}return bank.slice(0,10)}
function setupLevels(){const box=document.getElementById('levelList');box.innerHTML='';for(let i=0;i<10;i++){const d=document.createElement('div');d.className='level-item';d.innerHTML=`<div class="level-dot">${i+1}</div><div><b>第 ${i+1} 关</b><div class="small">${i<3?'基础':i<7?'进阶':'综合'}</div></div>`;box.appendChild(d)}}
function updateHUD(){score.textContent=state.score;combo.textContent=state.combo;lives.textContent='❤'.repeat(state.lives)+'♡'.repeat(3-state.lives);qIndex.textContent=state.index+1;bar.style.width=state.index/10*100+'%';[...document.querySelectorAll('.level-item')].forEach((e,i)=>e.className='level-item'+(i<state.index?' done':i===state.index?' active':''))}
function loadQuestion(){state.answered=false;nextBtn.disabled=true;const q=questions[state.index];modeLabel.textContent=modes[q.mode].name;tip.textContent='提示：'+modes[q.mode].tip;question.textContent=q.q;formula.textContent=q.formula;feedback.className='feedback';feedback.textContent='选择一个答案开始闯关。';choices.innerHTML='';q.choices.forEach((c,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+i)+'. '+c;b.onclick=()=>answer(i);choices.appendChild(b)});updateHUD();drawPlot(q.plot)}
function answer(i){if(state.answered)return;state.answered=true;const q=questions[state.index],bs=[...document.querySelectorAll('.choice')];bs.forEach(b=>b.disabled=true);bs[q.answer].classList.add('correct');if(i===q.answer){state.combo++;state.correctCount++;const gain=100+Math.min(100,state.combo*15);state.score+=gain;feedback.className='feedback good';feedback.textContent=`回答正确！+${gain} 分。${q.explain}`}else{state.combo=0;state.lives--;bs[i].classList.add('wrong');feedback.className='feedback bad';feedback.textContent='回答错误。'+q.explain}nextBtn.disabled=false;updateHUD();if(state.lives<=0)nextBtn.textContent='查看结果'}
nextBtn.onclick=()=>{if(!state.answered)return;if(state.lives<=0||state.index===9){endGame();return}state.index++;nextBtn.textContent='下一题';loadQuestion()};function endGame(){bar.style.width='100%';const passed=state.correctCount>=6;resultTitle.textContent=passed?'实验室通关！':'信号失真警报';const level=state.correctCount>=9?'信号大师':state.correctCount>=7?'系统分析师':state.correctCount>=5?'波形学徒':'建议再练一次';resultText.innerHTML=`本局答对 <b>${state.correctCount}/10</b> 题，得分 <b>${state.score}</b>。<br>评级：<b>${level}</b>`;overlay.classList.add('show')}
function restartGame(){state={score:0,lives:3,combo:0,index:0,answered:false,correctCount:0};questions=buildQuestions();overlay.classList.remove('show');nextBtn.textContent='下一题';setupLevels();loadQuestion()}
function axes(){const w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);ctx.fillStyle='#071525';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#173252';ctx.lineWidth=1;for(let x=40;x<w;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=30;y<h;y+=30){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}ctx.strokeStyle='#6b86aa';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(30,h/2);ctx.lineTo(w-20,h/2);ctx.stroke();ctx.beginPath();ctx.moveTo(w/2,20);ctx.lineTo(w/2,h-20);ctx.stroke();ctx.fillStyle='#9db2d4';ctx.font='14px sans-serif';ctx.fillText('t',w-28,h/2-8);ctx.fillText('x(t)',w/2+8,24)}
function line(p,c='#55d6be',wd=4){ctx.strokeStyle=c;ctx.lineWidth=wd;ctx.beginPath();p.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.stroke()}
function drawPlot(type){axes();const w=canvas.width,h=canvas.height,cx=w/2,cy=h/2;if(['base','transform','stretch'].includes(type)){line([[cx-170,cy],[cx-130,cy],[cx-80,cy-90],[cx+10,cy-35],[cx+80,cy-110],[cx+150,cy],[cx+190,cy]]);ctx.fillStyle='#55d6be';ctx.font='16px sans-serif';ctx.fillText('x(t)',cx+195,cy-8)}else if(type==='conv'){line([[cx-210,cy],[cx-120,cy],[cx,cy-110],[cx+120,cy],[cx+210,cy]])}else if(type==='impulse'){ctx.strokeStyle='#55d6be';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(cx+70,cy);ctx.lineTo(cx+70,cy-110);ctx.stroke();ctx.beginPath();ctx.moveTo(cx+62,cy-95);ctx.lineTo(cx+70,cy-110);ctx.lineTo(cx+78,cy-95);ctx.stroke()}else if(type==='delay'){line([[cx-190,cy],[cx-100,cy],[cx-100,cy-90],[cx+20,cy-90],[cx+20,cy],[cx+160,cy]],'#6ca8ff')}else if(type==='freq'||type==='phase'){const p=[];for(let x=0;x<w;x++){const z=(x-cx)/65;p.push([x,cy-95*Math.exp(-z*z/2)])}line(p,'#6ca8ff',4)}else if(type==='causal'){line([[cx-180,cy],[cx,cy],[cx,cy-90],[cx+70,cy-55],[cx+150,cy-30],[cx+210,cy-15]])}else{const p=[];for(let x=30;x<w-20;x+=3){const t=(x-cx)/45;p.push([x,cy-70*Math.sin(t)*Math.exp(-Math.abs(t)/8)])}line(p,'#55d6be',3)}}questions=buildQuestions();setupLevels();loadQuestion();
</script></body></html>
